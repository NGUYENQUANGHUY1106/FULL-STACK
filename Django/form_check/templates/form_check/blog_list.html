{% extends 'form_check/base.html' %}
{% block content %}
<h2>Danh sách bài đăng</h2>
<table border="1" cellpadding = "5">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Content</th>
    </tr>
    {% for item in blog %}
    <tr>
        <td>{{item.id}}</td>
        <td>{{item.title}}</td>
        <td>{{item.content}}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
