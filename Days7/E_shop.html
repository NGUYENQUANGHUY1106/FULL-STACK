<!doctype html>

  <head>

    <title>Document</title>
    <link rel="stylesheet" href="/Days7/e_shop.css" />

  <body>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .main {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
      }
      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .container .product {
        width: 400px;
        text-align: center;
      }
      .container .product img {
        width: 300px;
        height: 300px;
      }
      .qtycart {
        margin-top: 10px;
      }
      .qtycart img {
        width: 20px;
        height: 20x;
      }
    </style>

        <div class="product" data-id="product1">

              src="https://league2.vn/user-content/1310f557-cd7f-453e-a866-4fabdbcc38ac.jpg"
              alt=""
            />
          </div>
          <p class="price">$100</p>
          <p class="info">Áo thi đấu Argentina</p>
          <button onclick="addToCart(this)">Thêm vào giỏ hàng</button>
