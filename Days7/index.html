<!DOCTYPE html>
<html lang="en">
<head>

<body>
<style>
    table, th, td {
      border:1px solid black;
    }
    </style>

     <table style="width:100%">
       <thead>
          <tr>
            <th>email</th>
            <th>ten</th>
            
          </tr>
      </thead>
      <tbody id="table-body">
        
        
        
        
      </tbody>
    </table>
<script>
    let glocal = localStorage.getItem("objCha");
    let objCha = {}
    if(glocal){
        objCha = JSON.parse(glocal);
        console.log(objCha);
    }

    const tbody = document.getElementById("table-body");
    tbody.innerHTML = Object.values(objCha).map((value) => `
       <tr>
           <td>${value.xx}</td>
           <td>${value.yy}</td>
        </tr>
    `).join("");
</script>
</body>
