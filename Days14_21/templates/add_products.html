      <p>Quốc tịch</p>
      <input type="text" name="country" id="" />
      <p>Vị trí</p>
      <input type="text" name="position" id="" />
      <p>Lương</p>
      <input type="text" name="salary" id="" />

      <button type="submit">Thêm</button>
    </form>
