<div class="container_header">
  <div class="left_header">
    <div class="image_logo">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNuGV9A3rtoHvKx8-r2lIqlHJtXr5XQssU2Kt88LmQzg&s=10"
        alt=""
      />
    </div>

    <p>
      <a style="text-decoration: none; color: black" href="{% url 'home' %}"
        >QH-SHOPPER</a
      >
    </p>

  <ul class="right_header">

      <a href="{% url 'cart' %}">Cart </a>

    </div>
    <a href="{% url 'blog_list' %}">Blog</a>

    <a href="{% url 'custom_logout' %}">Logout</a>

    {% else %}
    <a href="{% url 'account'  %}">Account</a>
    <a href="">Cart</a>
    <a href="{% url 'blog_list' %}">Blog</a>
    <!-- <a href="{% url 'checkout' %}">CheckOut</a> -->
    <a href="{% url 'login' %}">Login</a>
    <a href="{% url 'register' %}">Register</a>

    {% endif %}
