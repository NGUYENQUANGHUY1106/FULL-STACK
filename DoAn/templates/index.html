{% extends 'base.html' %} {% block content %}

<div
  style="
    width: 1220px;
    margin: auto;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
  "
  class="home"
>
  {% for item in products %}

  <a
    href="{% url 'product_details' item.id %}"
    style="text-decoration: none; color: inherit"
  >
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: 1px solid rgb(230, 229, 229);
        margin: 10px;
        padding: 10px;
        width: 287px;
        text-align: center;
      "
      class="item"
    >
      {% if item.images %}
      <img
        style="width: 100%; height: 150px"
        src="/media/{{ item.images.0 }}"
        alt="{{ item.name }}"
      />
      {% endif %}

      <h3 style="color: orange; font-weight: 500; font-size: 22px">
        {{ item.price }} $
      </h3>

      <p style="font-size: 18px; color: gray">{{ item.name }}</p>

      <button
        style="
          padding: 10px;
          background-color: gray;
          color: white;
          border-radius: 10px;
        "
      >
        Add to Cart
      </button>
    </div>
  </a>

  {% empty %}

  <p>Không có sản phẩm nào</p>

  {% endfor %}
</div>

{% endblock %}
