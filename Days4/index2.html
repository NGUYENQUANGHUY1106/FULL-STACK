<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <style>
        .image_main img
        {
            width: 400px;
            height: 400px;
        }
        .list_item .item
        {
            list-style-type: none;
        }
        .list_item
        {
            display: flex;
            gap: 30px;
            padding: 0;
        }
        .list_item .item img
        {
            width: 200px;
            height: 200px;
        }
         
</style>
    <div class="content">
        <div class="image_main">
            <img src="https://png.pngtree.com/thumb_back/fh260/background/20201231/pngtree-winter-city-street-road-street-night-view-image_519115.jpg" alt="">
        </div>
        <ul class="list_item">
            <li class="item">
                <img src="https://png.pngtree.com/thumb_back/fw800/background/20251125/pngtree-scenic-road-stretching-toward-a-glowing-sunlit-horizon-surrounded-by-peaceful-image_20580206.webp" class="img_item" alt="">
            </li>
            <li class="item">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoiS6Ofh7pMZU7r2S_bi59-BodI3A9x6xj8w&s" class="img_item" alt="">
            </li>
            <li class="item">
                <img src="https://png.pngtree.com/background/20250122/original/pngtree-beautiful-mountain-road-view-nature-trip-background-picture-image_16096913.jpg" class="img_item" alt="">
            </li>
            <li class="item">
                <img src="https://img.pikbest.com/origin/09/42/18/59dpIkbEsTNCk.jpg!w700wp" class="img_item" alt="">
            </li>
            <li class="item">
                <img src="https://media.istockphoto.com/id/2157089736/vi/anh/chi%E1%BA%BFc-xe-m%C3%A0u-%C4%91%E1%BB%8F-tr%C3%AAn-con-%C4%91%C6%B0%E1%BB%9Dng-quanh-co.jpg?s=612x612&w=0&k=20&c=Us8fHpd6DIxYYXPbB39wT8Zbhm4EP77-g19NJqYEb7E=" class="img_item" alt="">
            </li>
        </ul>
    </div>
</body>
<script>
   let img_main = document.querySelector(".image_main img");

    
    let src_img_main = img_main.getAttribute("src");
    console.log(src_img_main);
    

    
    let items_img  = document.querySelectorAll(".item img");
    console.log(items_img);
    
     items_img.forEach(function(item)
    {
        item.addEventListener("click",function()
    {
        let src_img_curently = item.getAttribute("src");
        console.log(src_img_curently);
        img_main.setAttribute("src",src_img_curently);
        
    })
    })
    
</script>
</html>
