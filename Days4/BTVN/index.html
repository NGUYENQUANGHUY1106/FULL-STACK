<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      .contact-box {
        width: 500px;
        background: white;
        border: 1px solid #8bc34a;
        padding: 20px;
      }

      .title {
        background: #8bc34a;
        color: white;
        text-align: center;
        padding: 10px;
        font-weight: bold;
        margin: -20px -20px 20px;
      }

      .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }

      .form-group label {
        width: 120px;
        font-size: 14px;
      }

      .form-group input,
      .form-group textarea {
        flex: 1;
        padding: 6px;
        border: 1px solid #ccc;
      }

      .form-group textarea {
        height: 120px;
        resize: none;
      }

      .buttons {
        text-align: center;
        margin-top: 15px;
      }

      .buttons button {
        padding: 8px 20px;
        border: none;
        color: white;
        cursor: pointer;
        margin: 0 5px;
      }

      .send {
        background: #8bc34a;
      }

      .exit {
        background: #666;
      }

      .note {
        margin-top: 15px;
        font-size: 12px;
        color: #666;
        font-style: italic;
      }
    </style>
    <div class="contact-box">
      <form id="contact" action="https://www.24h.com.vn/">
        <div class="form-group">
          <label>Họ và tên</label>
          <input id="name" type="text" />
          <small id="errName"></small>
        </div>

        <div class="form-group">
          <label>Địa chỉ email</label>
          <input id="addressEmail" type="email" />
          <small id="addressEmailErr"></small>
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>
          <input id="phone" type="text" />
          <small id="errPhone"></small>
        </div>

        <div class="form-group">
          <label>Địa chỉ nơi ở</label>
          <input id="newAddress" type="text" />
          <small id="errNewAddress"></small>
        </div>

        <div class="form-group">
          <label>Tiêu đề</label>
          <input type="text" value="Góp ý 24H" />
        </div>

        <div class="form-group">
          <label>Nội dung</label>
          <textarea id="content"></textarea>
          <small id="errContent"></small>
        </div>

        <div class="buttons">
          <button type="submit" class="send">GỬI</button>
          <button type="reset" class="exit">THOÁT</button>
        </div>
      </form>
    </div>

    <script src="/Days4/BTVN/main.js"></script>
  </body>
</html>
