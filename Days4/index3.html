    <script>
      let infos = document.querySelectorAll(".demo ul li");
      let intro = document.querySelectorAll("img");
      console.log(intro);

      console.log(infos);

      infos.forEach(function (item) {
        item.addEventListener("click", function () {
          let sosanh = item.getAttribute("class");
          console.log(sosanh);
          
          intro.forEach(function (item) {
            let class_image = item.getAttribute("class");
            console.log(class_image);
            item.parentElement.classList.remove("show");
          item.parentElement.classList.add("hide");
            if (sosanh == class_image) {
              item.parentElement.classList.remove("hide")
              item.parentElement.classList.add("show")
              
            }
          });
        });
      });
    </script>
